services:
  config-server:
    build:
      context: ../..
      dockerfile: services/config-server/Dockerfile
    container_name: kwatera-config-server
    ports:
      - "8888:8888"
    volumes:
      - ../../config-repo:/config-repo:ro
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8888/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  service-registry:
    build:
      context: ../..
      dockerfile: services/service-registry/Dockerfile
    container_name: kwatera-service-registry
    ports:
      - "8761:8761"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
    depends_on:
      config-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 5s
      timeout: 3s
      retries: 10

  reservation-service:
    build:
      context: ../..
      dockerfile: services/reservation-service/Dockerfile
    container_name: kwatera-reservation-service
    ports:
      - "8080:8080"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/database
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      KWATERA_MAIL_FROM: no-reply@kwatera.local
      KWATERA_MAIL_TEST_RECIPIENT: guest@kwatera.local
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  db-migrations:
    build:
      context: ../..
      dockerfile: services/db-migrations/Dockerfile
    container_name: kwatera-db-migrations
    ports:
      - "8084:8084"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/database
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_started
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  property-service:
    build:
      context: ../..
      dockerfile: services/property-service/Dockerfile
    container_name: kwatera-property-service
    ports:
      - "8083:8083"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/database
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ../../backend-storage:/app/storage
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy

  auth-service:
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    container_name: kwatera-auth-service
    ports:
      - "8081:8081"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/database
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      KWATERA_MAIL_FROM: no-reply@kwatera.local
      KWATERA_MAIL_TEST_RECIPIENT: guest@kwatera.local
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY}
    depends_on:
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
      postgres:
        condition: service_started

  api-gateway:
    build:
      context: ../..
      dockerfile: services/api-gateway/Dockerfile
    container_name: kwatera-api-gateway
    ports:
      - "8090:8090"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka
    depends_on:
      config-server:
          condition: service_healthy
      service-registry:
          condition: service_healthy
    restart: on-failure

  ocr-service:
    build:
      context: ../..
      dockerfile: services/ocr-service/Dockerfile
    container_name: kwatera-ocr-service
    ports:
      - "8085:8085"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8085/health').read()",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: on-failure

  billing-service:
    build:
      context: ../..
      dockerfile: services/billing-service/Dockerfile
    container_name: kwatera-billing-service
    ports:
      - "8086:8086"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/database
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      JWT_SECRET: ${JWT_SECRET}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: 1025
      SPRING_MAIL_USERNAME: ""
      SPRING_MAIL_PASSWORD: ""
      KWATERA_MAIL_FROM: no-reply@kwatera.local
      KWATERA_MAIL_TEST_RECIPIENT: guest@kwatera.local
    depends_on:
      postgres:
        condition: service_started
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    restart: on-failure

  ai-pricing-service:
    build:
      context: ../..
      dockerfile: services/ai-pricing-service/Dockerfile
    container_name: kwatera-ai-pricing-service
    ports:
      - "8087:8087"
    environment:
      CONFIG_SERVER_URL: http://config-server:8888
      EUREKA_DEFAULT_ZONE: http://service-registry:8761/eureka
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/database
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_started
      config-server:
        condition: service_healthy
      service-registry:
        condition: service_healthy
    restart: on-failure

  frontend:
    build:
      context: ../..
      dockerfile: frontend/Dockerfile
    container_name: kwatera-frontend
    ports:
      - "5173:80"
    depends_on:
      api-gateway:
        condition: service_started
    restart: on-failure

  postgres:
    image: "postgres:latest"
    environment:
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_USER=${POSTGRES_USER}"
    ports:
      - "5433:5432"
    volumes:
      - ./images:/images

  mailpit:
    image: axllent/mailpit:latest
    container_name: kwatera-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
