name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

jobs:
  frontend-quality:
    name: Quality - frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Build frontend
        run: bun run build

  python-quality:
    name: Quality - ocr-service
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: services/ocr-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/ocr-service/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff lint
        run: ruff check .

      - name: Check Ruff formatting
        run: ruff format --check .

      - name: Run pytest
        run: pytest -q

      - name: Build Docker image
        run: docker build -f Dockerfile -t kwatera-ocr-service:ci ../..

  quality:
    name: Quality - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api-gateway
            sonar_enabled: true
            sonar_project_key: kwatera-project_KWATERA_api-gateway
          - service: auth-service
            sonar_enabled: true
            sonar_project_key: kwatera-project_KWATERA_auth-service
          - service: config-server
            sonar_enabled: true
            sonar_project_key: kwatera-project_KWATERA_config-server
          - service: property-service
            sonar_enabled: true
            sonar_project_key: kwatera-project_KWATERA_property-service
          - service: reservation-service
            sonar_enabled: true
            sonar_project_key: kwatera-project_KWATERA_reservation-service
          - service: service-registry
            sonar_enabled: true
            sonar_project_key: kwatera-project_KWATERA_service-registry
          - service: db-migrations
            sonar_enabled: true
            sonar_project_key: kwatera-project_KWATERA_db-migrations

    defaults:
      run:
        working-directory: services/${{ matrix.service }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Cache Sonar packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Check formatting
        run: ./mvnw -B -ntp spotless:check

      - name: Build, test and generate coverage
        run: ./mvnw -B -ntp clean verify

      - name: Run SpotBugs
        run: ./mvnw -B -ntp spotbugs:check

      - name: SonarQube Cloud analysis
        if: ${{ matrix.sonar_enabled }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp
          org.sonarsource.scanner.maven:sonar-maven-plugin:5.5.0.6356:sonar
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.projectKey=${{ matrix.sonar_project_key }}
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=true

      - name: Skip SonarQube Cloud analysis
        if: ${{ !matrix.sonar_enabled }}
        run: echo "Skipping SonarCloud for ${{ matrix.service }} because its SonarCloud project is not configured yet."

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.service }}
          if-no-files-found: ignore
          path: |
            services/${{ matrix.service }}/target/site/jacoco/**
            services/${{ matrix.service }}/target/surefire-reports/**
            services/${{ matrix.service }}/target/failsafe-reports/**
            services/${{ matrix.service }}/target/spotbugsXml.xml