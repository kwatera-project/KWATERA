spring:
  profiles:
    active: native
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: none
  mail:
    host: localhost
    port: 1025
  flyway:
    enabled: false

eureka:
  client:
    enabled: false

jwt:
  secret: test-secret

stripe:
  secret-key: test-secret-key
  webhook:
    secret: test_secret

services:
  property:
    url: http://localhost:8080
  ocr:
    url: http://localhost:8081
  auth:
    url: http://localhost:8082

ocr:
  confidence-threshold: 0.7

kwatera:
  mail:
    from: no-reply@kwatera.local
    test-recipient: guest@kwatera.local
    default-owner-email: owner1@example.com
  security:
    internal-token: test-internal-token
  frontend:
    url: http://localhost:5173

