server:
  port: 8086

spring:
  application:
    name: billing-service
  profiles:
    active: native
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  cloud:
    config:
      server:
        native:
          search-locations: file:/config-repo
  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

services:
  property:
    url: http://property-service/api/properties
  ocr:
    url: http://ocr-service:8085
  auth:
    url: http://auth-service/api/auth/users

ocr:
  confidence-threshold: 0.70

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  webhook-secret: ${STRIPE_WEBHOOK_SECRET}
  publishable-key: ${STRIPE_PUBLISHABLE_KEY}

jwt:
  secret: ${JWT_SECRET}

kwatera:
  mail:
    from: ${KWATERA_MAIL_FROM:no-reply@kwatera.local}
    test-recipient: ${KWATERA_MAIL_TEST_RECIPIENT:guest@kwatera.local}
    default-owner-email: ${KWATERA_MAIL_DEFAULT_OWNER_EMAIL:owner1@example.com}
  security:
    internal-token: ${KWATERA_INTERNAL_TOKEN:kwatera-internal-secret-token}
  frontend:
    url: ${KWATERA_FRONTEND_URL:http://localhost:5173}

