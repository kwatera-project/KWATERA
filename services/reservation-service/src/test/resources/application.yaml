spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop

eureka:
  client:
    enabled: false

kwatera:
  reservation:
    cleanup:
      cron: "0 */5 * * * *"
      expiration-minutes: 15
    upcoming-check:
      cron: "0 0 8 * * *"
      zone: "Europe/Warsaw"
  security:
    internal-token: kwatera-internal-secret-token