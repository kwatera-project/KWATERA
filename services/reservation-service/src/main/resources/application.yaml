server:
  port: 8080

spring:
  application:
    name: reservation-service
  config:
    import: optional:configserver:http://config-server:8888
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  kafka:
    bootstrap-servers: kafka:9092
    consumer:
      group-id: reservation-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.ByteArrayDeserializer
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

kwatera:
  business-zone: ${KWATERA_BUSINESS_ZONE:Europe/Warsaw}
  mail:
    from: ${KWATERA_MAIL_FROM:no-reply@kwatera.local}
    test-recipient: ${KWATERA_MAIL_TEST_RECIPIENT:guest@kwatera.local}
  reservation:
    cleanup:
      cron: ${KWATERA_RESERVATION_CLEANUP_CRON:0 */5 * * * *}
      expiration-minutes: ${KWATERA_RESERVATION_CLEANUP_EXPIRATION_MINUTES:15}

