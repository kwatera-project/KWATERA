server:
  port: 8090

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://config-server:8888
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:5174"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        - id: reservation-service
          uri: lb://reservation-service
          predicates:
            - Path=/api/v1/reservations/**

        - id: reservation-service-admin
          uri: lb://reservation-service
          predicates:
            - Path=/api/v1/admin/reservations/**

        - id: reservation-service-availability
          uri: lb://reservation-service
          predicates:
            - Path=/api/availability/**

        - id: property-service
          uri: lb://property-service
          predicates:
            - Path=/api/properties/**

  security:
    oauth2:
      client:
        provider:
          platform-auth-server:
            authorization-uri: http://localhost:8081/oauth2/authorize
            token-uri: http://localhost:8081/oauth2/token
            jwk-set-uri: http://localhost:8081/oauth2/jwks
        registration:
          gateway-client:
            provider: platform-auth-server
            client-id: gateway-client
            client-secret: "secret"
            client-authentication-method: client_secret_basic
            authorization-grant-type: authorization_code
            redirect-uri: http://localhost:8090/login/oauth2/code/gateway-client
            scope:
              - openid
              - profile
              - email

      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info