server:
  port: ${AI_SERVICE_PORT:8088}
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  paths-to-match: /internal/ai/**
  swagger-ui:
    disable-swagger-default-url: true

spring:
  application:
    name: ai-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    config:
      request-connect-timeout: 2000
      request-read-timeout: 3000

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

kwatera:
  security:
    internal-token: ${KWATERA_INTERNAL_TOKEN:}
  ai:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    summary-model: ${OLLAMA_SUMMARY_MODEL:${OLLAMA_MODEL:qwen3:4b-instruct-2507-q4_K_M}}
    translation-model: ${OLLAMA_TRANSLATION_MODEL:translategemma:4b}
    translation-format: ${AI_TRANSLATION_FORMAT:TRANSLATE_GEMMA}
    connect-timeout: ${AI_CONNECT_TIMEOUT:2s}
    request-timeout: ${AI_REQUEST_TIMEOUT:120s}
    readiness-timeout: ${AI_READINESS_TIMEOUT:2s}
    temperature: ${AI_TEMPERATURE:0.1}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:1024}
    context-tokens: ${AI_CONTEXT_TOKENS:8192}
    max-reviews: ${AI_MAX_REVIEWS:20}
    max-review-characters: ${AI_MAX_REVIEW_CHARACTERS:2000}
    max-total-review-characters: ${AI_MAX_TOTAL_REVIEW_CHARACTERS:6000}
    max-translation-characters: ${AI_MAX_TRANSLATION_CHARACTERS:2000}
    max-response-characters: ${AI_MAX_RESPONSE_CHARACTERS:16000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,ollama
