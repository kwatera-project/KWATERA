server:
  port: 8089

spring:
  application:
    name: review-service
  config:
    import: optional:configserver:http://config-server:8888
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

kwatera:
  security:
    internal-token: ${KWATERA_INTERNAL_TOKEN:kwatera-internal-secret-token}
  review-summary:
    cron: "${REVIEW_SUMMARY_CRON:-}"
  ai:
    internal-token: ${REVIEW_AI_INTERNAL_TOKEN:}
    read-timeout: ${REVIEW_AI_READ_TIMEOUT:130s}