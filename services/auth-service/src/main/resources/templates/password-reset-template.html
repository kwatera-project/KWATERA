<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{base-layout :: layout(~{::content})}">
    <div th:fragment="content">
        <h2 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.02em;">
            Password Reset Request
        </h2>
        
        <p style="margin: 0 0 24px 0; font-size: 15px; color: #7A7A7A; line-height: 1.6;">
            Hello,
        </p>

        <p style="margin: 0 0 24px 0; font-size: 15px; color: #7A7A7A; line-height: 1.6;">
            We received a request to reset your password. Click the button below to choose a new password. This link will expire in 30 minutes.
        </p>

        <div style="margin-bottom: 24px; text-align: center;">
            <a th:href="${resetUrl}" 
               style="display: inline-block; padding: 12px 24px; font-size: 15px; font-weight: 600; color: #FFFFFF; background-color: #42211D; border-radius: 8px; text-decoration: none; box-shadow: 0 4px 6px rgba(66, 33, 29, 0.15);">
                Reset Password
            </a>
        </div>
        
        <p style="margin: 0; font-size: 15px; color: #7A7A7A; line-height: 1.6;">
            If you did not request a password reset, please ignore this email or contact support if you have questions.
        </p>
    </div>
</div>
</body>
</html>
