<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:replace="~{base-layout :: layout(~{::content})}">
    <div th:fragment="content">
        <h2 style="margin: 0 0 16px 0; font-size: 22px; font-weight: 700; color: #1A1A1A; letter-spacing: -0.02em;">
            Weekly Newsletter
        </h2>
        <p style="margin: 0 0 24px 0; font-size: 15px; color: #7A7A7A; line-height: 1.6;">
            Hello <span th:text="${greeting}" style="font-weight: 600; color: #42211D;">Subscriber</span>,
        </p>
        <p style="margin: 0 0 24px 0; font-size: 15px; color: #7A7A7A; line-height: 1.6;">
            Here are this week's featured properties and updates from KWATERA.
        </p>
        <div style="margin-bottom: 24px;">
            <div th:each="item : ${featuredItems}" style="margin-bottom: 20px; padding: 15px; border: 1px solid #DACDCA; border-radius: 8px;">
                <h3 th:text="${item.title}" style="margin: 0 0 8px 0; font-size: 18px; color: #42211D;">Property Title</h3>
                <p th:text="${item.description}" style="margin: 0 0 12px 0; font-size: 14px; color: #7A7A7A; line-height: 1.5;">Description...</p>
                <a th:href="${item.link}" style="font-size: 14px; font-weight: 600; color: #42211D; text-decoration: none;">View Details →</a>
            </div>
        </div>
        <p style="margin: 0 0 24px 0; font-size: 13px; color: #7A7A7A; line-height: 1.6; text-align: center;">
            If you wish to stop receiving these emails, you can unsubscribe at any time.
        </p>
        <div style="text-align: center;">
            <a th:href="${unsubscribeLink}" style="font-size: 13px; color: #7A7A7A; text-decoration: underline;">
                Unsubscribe from newsletter
            </a>
        </div>
    </div>
</div>
</body>
</html>
