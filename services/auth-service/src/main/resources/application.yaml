server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://config-server:8888
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        options:
          model: llama-3.1-8b-instant

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

kwatera:
  mail:
    from: ${KWATERA_MAIL_FROM:no-reply@kwatera.local}
    test-recipient: ${KWATERA_MAIL_TEST_RECIPIENT:guest@kwatera.local}
  security:
    internal-token: ${KWATERA_INTERNAL_TOKEN:kwatera-internal-secret-token}
  urls:
    public-gateway: ${PUBLIC_GATEWAY_URL:http://localhost:8090}
    frontend-base: ${FRONTEND_BASE_URL:http://localhost:5173}

services:
  property:
    url: http://property-service/api/properties