server:
  port: 8081

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://config-server:8888
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health,info

kwatera:
  mail:
    from: ${KWATERA_MAIL_FROM:no-reply@kwatera.local}
    test-recipient: ${KWATERA_MAIL_TEST_RECIPIENT:guest@kwatera.local}
  security:
    internal-token: ${KWATERA_INTERNAL_TOKEN:kwatera-internal-secret-token}

services:
  property:
    url: http://property-service/api/properties