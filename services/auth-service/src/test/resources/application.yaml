spring:
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
  mail:
    host: localhost
    port: 1025

eureka:
  client:
    enabled: false

kwatera:
  mail:
    from: no-reply@kwatera.local
    test-recipient: guest@kwatera.local
  security:
    internal-token: kwatera-internal-secret-token
  urls:
    public-gateway: http://localhost:8090
    frontend-base: http://localhost:5173