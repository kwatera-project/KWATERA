server:
  port: 8083

spring:
  application:
    name: property-service
  config:
    import: optional:configserver:http://config-server:8888
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none

app:
  file-server-url: http://localhost:8083

jwt:
  secret: ${JWT_SECRET}

services:
  reservation:
    url: http://reservation-service

eureka:
  client:
    serviceUrl:
      defaultZone: http://service-registry:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info

kwatera:
  security:
    internal-token: ${KWATERA_INTERNAL_TOKEN:kwatera-internal-secret-token}